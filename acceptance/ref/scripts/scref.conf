[sdl]
fullscreen=false
output=surface
windowresolution=original
showmenu=false
autolock=false
waitonerror=false

[dosbox]
machine=ega
memsize=1
captures=~/scref/capture
startbanner=false
fastbioslogo=true
quit warning=false

[render]
aspect=false
scaler=none
frameskip=0

[cpu]
core=normal
cputype=8086
cycles=fixed 3000

[mixer]
nosound=false
rate=22050

[speaker]
pcspeaker=true

[autoexec]
mount c ~/scref/game
c:
START.BAT
