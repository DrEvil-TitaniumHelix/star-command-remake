<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STARPORT dev</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; display: block; }
  #msg { position: fixed; left: 8px; bottom: 8px; color: #aaa; font: 12px monospace; white-space: pre; }
</style>
</head>
<body>
<canvas id="screen" width="640" height="400"></canvas>
<div id="msg"></div>
<script type="module">
  import { boot } from '../../engine/engine.js';
  const msg = document.getElementById('msg');
  const p = new URLSearchParams(location.search);
  try {
    const E = await boot(document.getElementById('screen'), { assets: '../../assets/' });
    window.E = E;
    const m = await import('../starport.js');
    const r = await m.default(E, { screen: p.get('screen') || 'PT-02', filesBase: p.get('files') || '../../assets/files/' });
    msg.textContent = `STARPORT returned ${JSON.stringify(r)}`;
  } catch (err) {
    msg.textContent = `error: ${err.message}`;
    console.error(err);
  }
</script>
</body>
</html>
