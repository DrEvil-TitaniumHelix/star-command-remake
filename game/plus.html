<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Command Plus</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #f0f0f0; color: #111; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
  nav { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid #aaa; background: #e8e8e8; position: sticky; top: 0; }
  nav button { font: inherit; padding: 4px 12px; border: 1px solid #aaa; border-bottom: none; border-radius: 3px 3px 0 0; background: #ddd; cursor: pointer; margin-bottom: -1px; }
  nav button[aria-selected="true"] { background: #fff; border-bottom: 1px solid #fff; font-weight: 600; }
  main { padding: 8px 14px 16px; background: #fff; min-height: calc(100vh - 48px); box-sizing: border-box; }
  h2 { font-size: 14px; margin: 12px 0 4px; }
  ul { margin: 0; padding-left: 20px; }
  fieldset { border: 1px solid #ccc; margin: 8px 0; }
  label { display: flex; align-items: center; gap: 6px; min-height: 24px; }
  button { font: inherit; }
  main > button, main div button { padding: 2px 9px; margin: 4px 6px 0 0; }
  pre { white-space: pre-wrap; font: 12px/1.4 Consolas, monospace; }
</style>
</head>
<body>
<script type="module">
  import { runPlusWindow } from './engine/plus.js';
  runPlusWindow(document);
</script>
</body>
</html>
